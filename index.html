<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 멀티 텔레스트레이션</title>
    <style>
        * { box-sizing: border-box; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
        body {
            background-color: #f0f4f8;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2c3e50;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 560px;
            text-align: center;
        }
        h1 { margin: 0 0 10px; font-size: 1.8em; color: #34495e; }
        h2 { margin: 0 0 15px; font-size: 1.4em; }
        .hidden { display: none !important; }
        input[type="text"], select, button {
            padding: 12px 16px;
            font-size: 16px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #dce1e7;
            width: 100%;
        }
        input[type="text"]:focus, select:focus { outline: none; border-color: #3498db; }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover { background-color: #2980b9; transform: translateY(-1px); }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; transform: none; }
        .btn-green { background-color: #2ecc71; }
        .btn-green:hover { background-color: #27ae60; }
        .btn-orange { background-color: #e67e22; }
        .btn-orange:hover { background-color: #d35400; }
        
        .avatar-select {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 10px 0 15px 0;
        }
        .avatar-option {
            font-size: 24px;
            padding: 6px;
            border-radius: 50%;
            border: 2px solid #dce1e7;
            background: #f8f9fa;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .avatar-option.selected {
            border-color: #3498db;
            background: #e8f4fd;
            transform: scale(1.1);
        }

        .room-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        .room-badge {
            background: #e8f4fd;
            color: #2980b9;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.3em;
            letter-spacing: 2px;
        }
        .btn-copy {
            width: auto !important;
            padding: 8px 14px !important;
            margin: 0 !important;
            font-size: 14px !important;
            background-color: #95a5a6;
        }
        .btn-copy:hover { background-color: #7f8c8d; }

        .player-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .player-list li {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-container {
            border: 1px solid #dce1e7;
            border-radius: 12px;
            background: #f8f9fa;
            padding: 10px;
            margin-top: 10px;
            text-align: left;
        }
        .chat-messages {
            height: 90px;
            overflow-y: auto;
            font-size: 13px;
            margin-bottom: 8px;
            padding-right: 5px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-msg { background: white; padding: 5px 10px; border-radius: 8px; border: 1px solid #e9ecef; }
        .chat-input-row { display: flex; gap: 6px; margin: 0; }
        .chat-input-row input { margin: 0; padding: 8px; font-size: 13px; }
        .chat-input-row button { width: 65px; margin: 0; padding: 8px; font-size: 13px; }

        .clue-box {
            background: #fff3cd;
            border: 2px dashed #ffc107;
            padding: 10px;
            border-radius: 12px;
            margin: 8px 0;
            font-size: 1.2em;
            font-weight: bold;
            color: #856404;
        }
        .timer-box {
            font-size: 1.05em;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 6px;
        }
        canvas {
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            cursor: crosshair;
            background: #ffffff;
            touch-action: none;
            max-width: 100%;
            margin: 6px 0;
        }
        
        .palette-container {
            background: #f8f9fa;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 6px;
        }
        .tools {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .tools button {
            width: auto;
            padding: 6px 12px;
            font-size: 13px;
            margin: 0;
            background-color: #64748b;
        }
        .tools button.active { background-color: #1e293b; box-shadow: 0 0 0 2px #38bdf8; }
        .color-btn {
            width: 32px !important;
            height: 32px;
            padding: 0 !important;
            border-radius: 50% !important;
            border: 2px solid #fff !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .color-btn.active-color {
            border: 3px solid #f59e0b !important;
            transform: scale(1.15);
        }
        #color-picker {
            width: 34px;
            height: 34px;
            border: 2px solid #fff;
            border-radius: 50%;
